name: Check NKON Stock

on:
  workflow_dispatch:
  repository_dispatch:
    types: [check_stock_trigger]

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m `pip install --upgrade pip`
          pip install requests beautifulsoup4

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python check_stock.py

      - name: Commit and push changes if status changed
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add status_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update stock status cache [skip ci]" && git push)
